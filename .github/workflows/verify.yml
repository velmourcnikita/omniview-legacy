name: Verify legacy and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            target: i686-win7-windows-msvc
          - arch: x64
            target: x86_64-win7-windows-msvc
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install resource compiler
        shell: pwsh
        run: |
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw 'Toolchain hash mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'llvm')
          (Join-Path $env:RUNNER_TEMP 'llvm/llvm-mingw-20261020-ucrt-x86_64/bin') | Out-File $env:GITHUB_PATH -Append
      - name: Install pinned Rust and standard library sources
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rust-src --component rustfmt
          rustup default 1.99.1
      - name: Format and tests
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test '-Zbuild-std=std,panic_abort' --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify imports
        env:
          OMNIVIEW_BUILD_COMMIT: ${{ github.sha }}
        run: ./scripts/package.ps1 -Architecture ${{ matrix.arch }}
      - name: Native interface smoke check
        shell: pwsh
        run: |
          $p = Start-Process -FilePath './dist/${{ matrix.arch }}/OmniView.exe' -ArgumentList '--ui-smoke' -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw 'Native interface did not exit' }
          if ($p.ExitCode -ne 0) { throw 'Native interface failed' }
          $report = Get-Content (Join-Path $env:LOCALAPPDATA 'OmniView-Legacy/native-ui-smoke.json') -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Native controls were not created' }
      - name: Attest application files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/**/*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/OmniView.exe
            dist/${{ matrix.arch }}/OmniView-Student.exe
          if-no-files-found: error
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - runner: macos-15-intel
            target: aarch64-apple-darwin
            platform: macos-arm64
            test_args: --no-run
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi6 libxcursor1 libxinerama1 libxcb1-dev libxcb-randr0-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libwayland-dev xvfb xauth
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1
          rustup target add ${{ matrix.target }}
      - name: Check and test (compile only for cross target)
        run: |
          cargo fmt --check
          cargo test --locked --target ${{ matrix.target }} ${{ matrix.test_args }}
      - name: Build native application
        env:
          OMNIVIEW_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Linux interface and screen integration
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
          WINIT_UNIX_BACKEND: x11
        run: |
          unset WAYLAND_DISPLAY
          xvfb-run -a target/${{ matrix.target }}/release/omniview --ui-smoke
          xvfb-run -a target/${{ matrix.target }}/release/omniview --self-test
      - name: Package platform files
        run: python3 scripts/package-unix.py ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
  release:
    needs: [windows, unix]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: publish-application
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: update-*
          path: publish
      - name: Publish application files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'preview' }}
        run: python scripts/publish-build.py
